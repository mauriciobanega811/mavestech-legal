<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>Autorización completada | Mavestech</title>
<style>:root{color-scheme:dark}body{margin:0;background:#0a0a0a;color:#e8e8e8;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:40rem;margin:0 auto;padding:48px 24px}h1{font-size:1.6rem;margin:0 0 .5rem}p{color:#b5b5b5}
code{display:block;word-break:break-all;background:#161616;border:1px solid #2a2a2a;border-radius:8px;padding:12px;color:#fff;margin:12px 0}
button{font:inherit;font-weight:600;background:#3BB4E8;color:#06202b;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}a{color:#3BB4E8}</style></head>
<body><main>
<h1 id="t">Autorización</h1>
<p id="m">Esta página recibe la respuesta de TikTok cuando autorizás la conexión de Mavestech.</p>
<code id="c" hidden></code><button id="b" hidden>Copiar código</button>
<p><a href="https://www.mavestech.com.ar">Volver a mavestech.com.ar</a></p>
</main>
<script>
var q = new URLSearchParams(location.search), code = q.get("code"), err = q.get("error_description") || q.get("error");
var t = document.getElementById("t"), m = document.getElementById("m"), c = document.getElementById("c"), b = document.getElementById("b");
if (code) {
  t.textContent = "Autorización completada";
  m.textContent = "Copiá este código y pegalo en el script local. Es de un solo uso y vence en pocos minutos. No lo compartas con nadie.";
  c.textContent = code; c.hidden = false; b.hidden = false;
  b.onclick = function () { navigator.clipboard.writeText(code).then(function () { b.textContent = "Copiado"; }); };
  history.replaceState(null, "", location.pathname);
} else if (err) {
  t.textContent = "No se pudo autorizar";
  m.textContent = "TikTok respondió: " + err;
}
</script></body></html>
